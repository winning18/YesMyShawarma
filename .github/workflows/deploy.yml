name: Deploy

on:
  push:
    branches: [Main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, mysql, sqlite3, gd, intl, bcmath, zip

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare .env for testing
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run tests
        run: php artisan test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, mysql, sqlite3, gd, intl, bcmath, zip
          tools: composer

      - name: Install production Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        env:
          VITE_REVERB_APP_KEY: ${{ secrets.REVERB_APP_KEY }}
          VITE_REVERB_HOST: yesmyshawarma.com
          VITE_REVERB_PORT: 443
          VITE_REVERB_SCHEME: https
        run: |
          cp .env.example .env
          echo "VITE_REVERB_APP_KEY=${VITE_REVERB_APP_KEY}" >> .env
          echo "VITE_REVERB_HOST=${VITE_REVERB_HOST}" >> .env
          echo "VITE_REVERB_PORT=${VITE_REVERB_PORT}" >> .env
          echo "VITE_REVERB_SCHEME=${VITE_REVERB_SCHEME}" >> .env
          npm run build

      - name: Set up deploy SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      - name: Sync vendor/ and public/build/ to server
        run: |
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" vendor/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/yes-my-shawarma/vendor/
          rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" public/build/ \
            ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/yes-my-shawarma/public/build/

      - name: Update source code and restart services
        run: |
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} '
            set -e
            cd /var/www/yes-my-shawarma
            git fetch origin
            git reset --hard origin/Main
            php artisan migrate --force
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            sudo systemctl restart yes-my-shawarma-queue.service
            sudo systemctl restart yes-my-shawarma-reverb.service
            sudo systemctl reload php8.3-fpm
          '
