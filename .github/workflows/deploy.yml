name: Deploy

on:
  push:
    branches: [Main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, mysql, sqlite3, gd, intl, bcmath, zip

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        run: npm run build

      - name: Prepare .env for testing
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run tests
        run: php artisan test

      # The Express POS Print Agent (Windows program, step 8b).
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Test the print agent
        working-directory: print-agent
        run: go test ./...

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          extensions: mbstring, dom, fileinfo, mysql, sqlite3, gd, intl, bcmath, zip
          tools: composer

      - name: Install production Composer dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Node dependencies
        run: npm ci

      - name: Build frontend assets
        env:
          VITE_REVERB_APP_KEY: ${{ secrets.REVERB_APP_KEY }}
          VITE_REVERB_HOST: yesmyshawarma.com
          VITE_REVERB_PORT: 443
          VITE_REVERB_SCHEME: https
        run: |
          cp .env.example .env
          echo "VITE_REVERB_APP_KEY=${VITE_REVERB_APP_KEY}" >> .env
          echo "VITE_REVERB_HOST=${VITE_REVERB_HOST}" >> .env
          echo "VITE_REVERB_PORT=${VITE_REVERB_PORT}" >> .env
          echo "VITE_REVERB_SCHEME=${VITE_REVERB_SCHEME}" >> .env
          npm run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build the print agent for Windows
        working-directory: print-agent
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: |
          mkdir -p ../public/downloads
          go build -trimpath -ldflags "-s -w -X main.version=1.0.0+${GITHUB_SHA::7}" -o ../public/downloads/ExpressPOSPrintAgent.exe .

      - name: Set up deploy SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.DEPLOY_HOST }} >> ~/.ssh/known_hosts

      # Every live install (owner, 2026-11-24): the MVP release made Yes My
      # Shawarma an ordinary install, so Main updates every client listed in
      # /etc/expresspos/installs on the server: same build, code and
      # migrations, each restarting its own services. Staging and sandboxes
      # are the staging deploy's (deploy-staging.yml).
      - name: Update every live install
        run: |
          INSTALLS="$(ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'cat /etc/expresspos/installs 2>/dev/null || true')"
          if [ -z "${INSTALLS// /}" ]; then echo "No live installs registered: nothing deployed."; exit 1; fi
          for install in $INSTALLS; do
            [[ "$install" =~ ^expresspos-[a-z0-9]+$ ]] || { echo "Skipping odd install name: $install"; continue; }
            echo "==> $install"
            for part in vendor public/build public/downloads; do
              rsync -az --delete -e "ssh -i ~/.ssh/deploy_key" "$part/" \
                ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }}:/var/www/$install/$part/
            done
            ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} "
              set -e
              cd /var/www/$install
              git fetch origin
              git checkout --quiet -B Main origin/Main
              php artisan package:discover --ansi
              php artisan migrate --force
              php artisan config:cache
              php artisan route:cache
              php artisan view:cache
              sudo systemctl restart $install-queue.service
              sudo systemctl restart $install-reverb.service
            "
          done
          ssh -i ~/.ssh/deploy_key ${{ secrets.DEPLOY_USER }}@${{ secrets.DEPLOY_HOST }} 'sudo systemctl reload php8.3-fpm'
